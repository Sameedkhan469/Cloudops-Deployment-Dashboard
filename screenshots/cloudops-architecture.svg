<path d="M385 766H445V578H520" fill="none" stroke="#168a38" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M665 406V540" fill="none" stroke="#6b4bb8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
