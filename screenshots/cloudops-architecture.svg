<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf2fb"/></linearGradient>
  <linearGradient id="navy" x2="1" y2="0"><stop stop-color="#073b70"/><stop offset="1" stop-color="#0b5a9b"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#123" flood-opacity=".14"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#183b5b" stroke-width="1.5"/></marker>
  <style>
    .heading{font:700 30px Arial,sans-serif;fill:white}.section{font:700 20px Arial,sans-serif;fill:#10395e}
    .boxTitle{font:700 18px Arial,sans-serif;fill:#142d46}.small{font:15px Arial,sans-serif;fill:#35516b}
    .stack{font:600 17px Arial,sans-serif;fill:#173a5c}.white{fill:white}
    .node{fill:#fff;stroke:#2a5c88;stroke-width:2;rx:13;filter:url(#shadow)}
    .line{fill:none;stroke:#183b5b;stroke-width:2.5;marker-end:url(#arrow)}
    .green{fill:#168a38}.greenText{font:700 17px Arial,sans-serif;fill:#fff}
  </style>
</defs>
<rect width="1200" height="900" rx="22" fill="url(#bg)" stroke="#164c7b" stroke-width="3"/>
<path d="M22 0H1178Q1200 0 1200 22V82H0V22Q0 0 22 0Z" fill="url(#navy)"/>
<text x="600" y="52" text-anchor="middle" class="heading">CloudOps Deployment Dashboard – Architecture</text>

<!-- CI/CD lane -->
