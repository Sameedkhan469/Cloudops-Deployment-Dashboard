<text x="245" y="784" text-anchor="middle" class="small">GitHub Actions → Azure App Service</text>

<!-- IaC lane -->
<rect x="480" y="110" width="370" height="310" rx="18" fill="#f5faff" stroke="#b6cce0" stroke-width="2"/>
