<rect x="880" y="490" width="285" height="360" rx="18" fill="#fff" stroke="#b6cce0" stroke-width="2"/>
<path d="M898 490H1147Q1165 490 1165 508V540H880V508Q880 490 898 490Z" fill="url(#navy)"/>
<text x="1022" y="523" text-anchor="middle" class="heading" style="font-size:22px">Key Outcomes</text>
